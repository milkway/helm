name: Release

on:
  push:
    tags: ["v*"]

# necessário para o tauri-action criar o release e anexar os instaladores
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # glibc antiga = .deb mais compatível; se o runner sumir, migrar
          # para container 22.04 ou ubuntu-24.04
          - platform: ubuntu-22.04
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # número de build para a tela Sobre (ex.: 2026.07)
          HELM_BUILD: ${{ github.ref_name }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Helm ${{ github.ref_name }}"
          releaseBody: "Instaladores gerados automaticamente. `.dmg` (macOS) e `.deb` (Linux)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
