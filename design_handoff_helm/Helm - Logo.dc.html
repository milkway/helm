<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body { background:#08090b; }
    a { color:#e0a15e; } a:hover { color:#f0c99a; }
  </style>
</helmet>
<section style="padding:56px; display:flex; gap:40px; align-items:flex-start; flex-wrap:wrap; font-family:'Inter Tight',system-ui,sans-serif; color:#e6e8ea;">

  <!-- 1a · Mark -->
  <div id="1a">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <a href="#1a" style="text-decoration:none; font-size:12px; font-weight:700; font-family:'JetBrains Mono'; color:#e0a15e; background:rgba(224,161,94,.14); border:1px solid rgba(224,161,94,.3); border-radius:6px; padding:3px 9px;">1a</a>
      <span style="font-size:14px; font-weight:600; color:#c9cdd2;">Símbolo — leme + prompt</span>
    </div>
    <div style="width:360px; height:360px; background:radial-gradient(80% 80% at 30% 20%, #14171c 0%, #0b0d10 100%); border:1px solid rgba(255,255,255,.07); border-radius:20px; display:flex; align-items:center; justify-content:center;">
      <img src="assets/helm-logo.svg" style="width:176px; height:176px;" alt="Helm logo">
    </div>
  </div>

  <!-- 1b · App icon -->
  <div id="1b">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <a href="#1b" style="text-decoration:none; font-size:12px; font-weight:700; font-family:'JetBrains Mono'; color:#e0a15e; background:rgba(224,161,94,.14); border:1px solid rgba(224,161,94,.3); border-radius:6px; padding:3px 9px;">1b</a>
      <span style="font-size:14px; font-weight:600; color:#c9cdd2;">Ícone do app (dock)</span>
    </div>
    <div style="width:360px; height:360px; background:#0e1014; border:1px solid rgba(255,255,255,.07); border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px;">
      <div style="width:150px; height:150px; border-radius:34px; background:linear-gradient(160deg,#1a1d23 0%, #0e1013 70%); border:1px solid rgba(255,255,255,.1); box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.09); display:flex; align-items:center; justify-content:center;">
        <img src="assets/helm-logo.svg" style="width:86px; height:86px;" alt="">
      </div>
      <div style="display:flex; gap:26px; align-items:flex-end;">
        <div style="width:64px; height:64px; border-radius:15px; background:linear-gradient(160deg,#1a1d23,#0e1013); border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;"><img src="assets/helm-logo.svg" style="width:36px;" alt=""></div>
        <div style="width:40px; height:40px; border-radius:10px; background:linear-gradient(160deg,#1a1d23,#0e1013); border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;"><img src="assets/helm-logo.svg" style="width:23px;" alt=""></div>
        <div style="width:24px; height:24px; border-radius:6px; background:linear-gradient(160deg,#1a1d23,#0e1013); border:1px solid rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center;"><img src="assets/helm-logo.svg" style="width:14px;" alt=""></div>
      </div>
    </div>
  </div>

  <!-- 1c · Lockup -->
  <div id="1c">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <a href="#1c" style="text-decoration:none; font-size:12px; font-weight:700; font-family:'JetBrains Mono'; color:#e0a15e; background:rgba(224,161,94,.14); border:1px solid rgba(224,161,94,.3); border-radius:6px; padding:3px 9px;">1c</a>
      <span style="font-size:14px; font-weight:600; color:#c9cdd2;">Lockup horizontal + claro</span>
    </div>
    <div style="width:520px; display:flex; flex-direction:column; gap:20px;">
      <div style="height:170px; background:radial-gradient(80% 80% at 30% 20%, #14171c 0%, #0b0d10 100%); border:1px solid rgba(255,255,255,.07); border-radius:20px; display:flex; align-items:center; justify-content:center; gap:20px;">
        <img src="assets/helm-logo.svg" style="width:58px; height:58px;" alt="">
        <span style="font-size:52px; font-weight:600; letter-spacing:-1.5px; color:#f4f6f8;">Helm</span>
      </div>
      <div style="height:170px; background:#f2f0ec; border-radius:20px; display:flex; align-items:center; justify-content:center; gap:20px;">
        <img src="assets/helm-logo.svg" style="width:58px; height:58px;" alt="">
        <span style="font-size:52px; font-weight:600; letter-spacing:-1.5px; color:#22201d;">Helm</span>
      </div>
    </div>
  </div>
</section>
</x-dc>
</body>
</html>
